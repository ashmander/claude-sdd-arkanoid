<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Arkanoid</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: sans-serif;
    }

    canvas {
      background: #000;
      display: block;
    }

    #selectors {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      color: #eee;
    }

    .selector-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .selector-row label {
      width: 120px;
    }

    .selector-row button {
      width: 32px;
      height: 32px;
      font-size: 18px;
      cursor: pointer;
    }

    .selector-row span {
      width: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="640"></canvas>

  <div id="selectors">
    <div class="selector-row">
      <label for="level-value">Nivel:</label>
      <button id="level-minus">-</button>
      <span id="level-value">1</span>
      <button id="level-plus">+</button>
    </div>
    <div class="selector-row">
      <label for="speed-value">Velocidad inicial:</label>
      <button id="speed-minus">-</button>
      <span id="speed-value">6</span>
      <button id="speed-plus">+</button>
    </div>
  </div>

  <script src="assets/spritesheet.js"></script>
  <script src="game.js"></script>
</body>
</html>
